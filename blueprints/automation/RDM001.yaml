blueprint:
  name: Philips Hue Wall Switch (ZHA)
  description: |
    Control devices with a Philips Hue Wall Switch.

  domain: automation
  source_url: https://raw.githubusercontent.com/kwasmich/home-assistant/refs/heads/main/blueprints/automation/RDM001.yaml


  input:
    remote:
      name: Philips Hue Wall Switch
      description: Pick either RDM001
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: Signify Netherlands B.V.
              model: RDM001
          entity:
            - domain:
                - sensor
              device_class:
                - battery
          multiple: false

    light_left:
      name: The light(s) to control by the Left Rocker Button
      description: >
        The light entity to control brightness
        (only a single entity is supported; use light groups when needed)
      selector:
        entity:
          domain: light

    button_left_single:
      name: Left Rocker Button - Press
      description: Action to run when single pressing the Left Rocker Button
      default: []
      selector:
        action:

    scene_1:
      name: Scene 1
      description: Action to run when activating Scene 1
      default: []
      selector:
        action:

    scene_2:
      name: Scene 2
      description: Action to run when activating Scene 2
      default: []
      selector:
        action:

    scene_3:
      name: Scene 3
      description: Action to run when activating Scene 3
      default: []
      selector:
        action:

    scene_4:
      name: Scene 4
      description: Action to run when activating Scene 4
      default: []
      selector:
        action:

    scene_5:
      name: Scene 5
      description: Action to run when activating Scene 5
      default: []
      selector:
        action:


mode: single


trace:
  stored_traces: 20


variables:
  remote: !input "remote"
  light_left: !input "light_left"
  button_left_single: !input button_left_single
  min_brightness: 2
  timeout_s: 3


triggers:
  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_short_press
    subtype: turn_on
    id: left_short_press

  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_double_press
    subtype: turn_on
    id: left_double_press

  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_long_press
    subtype: turn_on
    id: left_long_press


actions:
  - variables:
      fin: false
      scene: 0
      left_lights_on: "{{ expand(light_left) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
      left_cur_brightness: "{{ state_attr(light_left, 'brightness') | int(default=0) }}"
      # right_lights_on: "{{ expand(light_right) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
      # right_cur_brightness: "{{ state_attr(light_right, 'brightness') | int(default=0) }}"
      once: false

  - choose:
      - conditions:
          - condition: trigger
            id: left_short_press
        sequence:
          - if:
              - condition: light.is_on
                target:
                  entity_id: !input "light_left"
            then:
              - action: light.turn_off
                target:
                  entity_id: !input "light_left"
                data:
                  transition: 0.2
            else:
              - variables:
                  scene: -1
              - repeat:
                  while:
                    - condition: template
                      value_template: '{{ not fin }}'
                  sequence:
                    - variables:
                        scene: '{{ scene + 1 }}'
                    - parallel:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: '{{ scene == 0 }}'
                              sequence:          
                                - if:
                                    - condition: template
                                      value_template: '{{ button_left_single | length > 0 }}'
                                  then: !input button_left_single
                                  else:
                                    - action: light.turn_on
                                      target:
                                        entity_id: !input "light_left"
                                      data:
                                        transition: 0.2
                            - conditions:
                                - condition: template
                                  value_template: '{{ scene == 1 }}'
                              sequence: !input scene_1
                            - conditions:
                                - condition: template
                                  value_template: '{{ scene == 1 }}'
                              sequence: !input scene_1
                            - conditions:
                                - condition: template
                                  value_template: '{{ scene == 2 }}'
                              sequence: !input scene_2
                            - conditions:
                                - condition: template
                                  value_template: '{{ scene == 3 }}'
                              sequence: !input scene_3
                            - conditions:
                                - condition: template
                                  value_template: '{{ scene == 4 }}'
                              sequence: !input scene_4
                            - conditions:
                                - condition: template
                                  value_template: '{{ scene == 5 }}'
                              sequence: !input scene_5
                          default:
                            - stop: 'End of Scenes'
                        - sequence:
                            - wait_for_trigger:
                                - device_id: !input "remote"
                                  domain: zha
                                  type: remote_button_short_press
                                  subtype: turn_on
                                  trigger: device
                              timeout:
                                seconds: "{{ timeout_s }}"
                            - variables:
                                fin: '{{ not wait.completed }}'

      - conditions:
          - condition: trigger
            id: left_double_press
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: '{{ not fin }}'
              sequence:
                - variables:
                    scene: '{{ scene + 1 }}'
                - parallel:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: '{{ scene == 1 }}'
                          sequence: !input scene_1
                        - conditions:
                            - condition: template
                              value_template: '{{ scene == 2 }}'
                          sequence: !input scene_2
                        - conditions:
                            - condition: template
                              value_template: '{{ scene == 3 }}'
                          sequence: !input scene_3
                        - conditions:
                            - condition: template
                              value_template: '{{ scene == 4 }}'
                          sequence: !input scene_4
                        - conditions:
                            - condition: template
                              value_template: '{{ scene == 5 }}'
                          sequence: !input scene_5
                      default:
                        - stop: 'End of Scenes'
                    - sequence:
                        - wait_for_trigger:
                            - device_id: !input "remote"
                              domain: zha
                              type: remote_button_short_press
                              subtype: turn_on
                              trigger: device
                          timeout:
                            seconds: "{{ timeout_s }}"
                        - variables:
                            fin: '{{ not wait.completed }}'

      - conditions:
          - condition: trigger
            id: left_long_press
        sequence:
          - variables:
              fin: false
              dir: 1
              pressed: true
          - if:
              - condition: light.is_brightness
                target:
                  entity_id: !input light_left
                options:
                  threshold:
                    type: above
                    value:
                      active_choice: number
                      number: 50
            then:
              - variables:
                  dir: -1
            else:
              - variables:
                  dir: 1
          - parallel:
              - repeat:
                  while:
                    - condition: template
                      value_template: '{{ not fin }}'
                  sequence:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: '{{ (dir == 1) and pressed }}'
                          sequence:
                            - variables:
                                left_cur_brightness: "{{ left_cur_brightness + 16 }}"
                            - action: light.turn_on
                              target:
                                entity_id: "{{ left_lights_on }}"
                              data:
                                brightness: "{{ min(255, left_cur_brightness) }}"
                                transition: 0.3
                        - conditions:
                            - condition: template
                              value_template: '{{ (dir == -1) and pressed }}'
                          sequence:
                            - variables:
                                left_cur_brightness: "{{ left_cur_brightness - 16 }}"
                            - action: light.turn_on
                              target:
                                entity_id: "{{ left_lights_on }}"
                              data:
                                brightness: "{{ max(min_brightness, left_cur_brightness) }}"
                                transition: 0.3
              - repeat:
                  while:
                    - condition: template
                      value_template: '{{ not fin }}'
                  sequence:
                    - if:
                        - condition: template
                          value_template: '{{ pressed }}'
                      then:
                        - wait_for_trigger:
                            - device_id: !input remote
                              domain: zha
                              type: remote_button_long_release
                              subtype: turn_on
                              trigger: device
                            - device_id: !input remote
                              domain: zha
                              type: remote_button_short_release
                              subtype: turn_on
                              trigger: device
                          timeout:
                            seconds: 5
                        - if:
                            - condition: template
                              value_template: '{{ wait.completed }}'
                          then:
                            - variables:
                                dir: '{{ dir * -1 }}'
                                pressed: false
                      else:
                        - wait_for_trigger:
                            - device_id: !input remote
                              domain: zha
                              type: remote_button_long_press
                              subtype: turn_on
                              trigger: device
                            - device_id: !input remote
                              domain: zha
                              type: remote_button_short_press
                              subtype: turn_on
                              trigger: device
                          timeout:
                            seconds: 5
                        - if:
                            - condition: template
                              value_template: '{{ wait.completed }}'
                          then:
                            - variables:
                                pressed: true
                          else:
                            - variables:
                                fin: true
