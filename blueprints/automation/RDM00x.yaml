blueprint:
  name: Philips Hue Wall Switch (ZHA)
  description: |
    Control devices with a Philips Hue Wall Switch.

  domain: automation
  #   source_url: https://gist.github.com/kwasmich/

  # Define the inputs for the blueprint
  input:
    remote:
      name: Philips Hue Wall Switch
      description: Pick either RDM001 or RDM004
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: Signify Netherlands B.V.
              model: RDM001
            - integration: zha
              manufacturer: Signify Netherlands B.V.
              model: RDM004
          entity:
            - domain:
                - sensor
              device_class:
                - battery
          multiple: false

    light_left:
      name: The light(s) to control by the Left Rocker Button
      description: >
        The light entity to control brightness
        (only a single entity is supported; use light groups when needed)
      # default: []
      selector:
        entity:
          domain: light

    # light_right:
    #   name: The light(s) to control by the Right Rocker Button
    #   description: >
    #     The light entity to control brightness
    #     (only a single entity is supported; use light groups when needed)
    #   # default: []
    #   selector:
    #     entity:
    #       domain: light

    button_left_single:
      name: Left Rocker Button - Press
      description: Action to run when single pressing the Left Rocker Button
      default: []
      selector:
        action:

    button_left_double:
      name: Left Rocker Button - Press 2x
      description: Action to run when double pressing the Left Rocker Button
      default: []
      selector:
        action:

    button_left_triple:
      name: Left Rocker Button - Press 3x
      description: Action to run when triple pressing the Left Rocker Button
      default: []
      selector:
        action:

    button_left_quadruple:
      name: Left Rocker Button - Press 4x
      description: Action to run when quadruple pressing the Left Rocker Button
      default: []
      selector:
        action:

    button_left_quintuple:
      name: Left Rocker Button - Press 5x
      description: Action to run when quintuple pressing the Left Rocker Button
      default: []
      selector:
        action:

    # button_right_single:
    #   name: Right Rocker Button - Press
    #   description: Action to run when single pressing the Right Rocker Button
    #   default: []
    #   selector:
    #     action:

    # button_right_double:
    #   name: Right Rocker Button - Press 2x
    #   description: Action to run when double pressing the Right Rocker Button
    #   default: []
    #   selector:
    #     action:

    # button_right_triple:
    #   name: Right Rocker Button - Press 3x
    #   description: Action to run when triple pressing the Right Rocker Button
    #   default: []
    #   selector:
    #     action:

    # button_right_quadruple:
    #   name: Right Rocker Button - Press 4x
    #   description: Action to run when quadruple pressing the Right Rocker Button
    #   default: []
    #   selector:
    #     action:

    # button_right_quintuple:
    #   name: Right Rocker Button - Press 5x
    #   description: Action to run when quintuple pressing the Right Rocker Button
    #   default: []
    #   selector:
    #     action:

# mode: restart
mode: single
# max_exceeded: silent

variables:
  remote: !input "remote"
  light_left: !input "light_left"
  # light_right: !input "light_right"
  short_timeout_ms: 750
  long_timeout_s: 2


triggers:
  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_short_press
    subtype: turn_on
    id: left_short_press

  # - platform: device
  #   device_id: !input remote
  #   domain: zha
  #   type: remote_button_double_press
  #   subtype: turn_on
  #   id: left_short_press

  # - platform: device
  #   device_id: !input remote
  #   domain: zha
  #   type: remote_button_triple_press
  #   subtype: turn_on
  #   id: left_short_press

  # - platform: device
  #   device_id: !input remote
  #   domain: zha
  #   type: remote_button_quadruple_press
  #   subtype: turn_on
  #   id: left_short_press

  # - platform: device
  #   device_id: !input remote
  #   domain: zha
  #   type: remote_button_quintuple_press
  #   subtype: turn_on
  #   id: left_short_press

  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_long_press
    subtype: turn_on
    id: left_hold_start

  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_long_release
    subtype: turn_on
    id: left_hold_release

actions:
  - variables:
      command: "{{ trigger.event.data.command }}"
      left_lights_on: "{{ expand(light_left) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
      left_cur_brightness: "{{ state_attr(light_left, 'brightness') | int(default=0) }}"
      # right_lights_on: "{{ expand(light_right) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
      # right_cur_brightness: "{{ state_attr(light_right, 'brightness') | int(default=0) }}"
      once: false

  - choose:
      - conditions:
          - condition: trigger
            id: left_short_press
        sequence:
          - if:
              - condition: light.is_off
                target:
                  entity_id: !input "light_left"
            then:
              - variables:
                  once: true
                  next_timeout_s: "{{ long_timeout_s }}"
                  next_timeout_ms: 0
              - sequence: !input button_left_single
            else:
              - variables:
                  next_timeout_s: 0
                  next_timeout_ms: "{{ short_timeout_ms }}"
          - wait_for_trigger:
              - platform: device
                device_id: !input remote
                domain: zha
                type: remote_button_short_press
                subtype: turn_on
              # - platform: device
              #   device_id: !input remote
              #   domain: zha
              #   type: remote_button_double_press
              #   subtype: turn_on
              # - platform: device
              #   device_id: !input remote
              #   domain: zha
              #   type: remote_button_triple_press
              #   subtype: turn_on
              # - platform: device
              #   device_id: !input remote
              #   domain: zha
              #   type: remote_button_quadruple_press
              #   subtype: turn_on
              # - platform: device
              #   device_id: !input remote
              #   domain: zha
              #   type: remote_button_quintuple_press
              #   subtype: turn_on
            timeout:
              hours: 0
              minutes: 0
              seconds: "{{ next_timeout_s }}"
              milliseconds: "{{ next_timeout_ms }}"
              # seconds: 0
              # milliseconds: "{{ short_timeout_ms }}"
            enabled: true
          - if:
              - condition: template
                value_template: "{{ not wait.trigger }}"
            then:
              - if:
                  - condition: template
                    value_template: '{{ once == false }}'
                then: !input button_left_single
                else:
            else:
              - sequence: !input button_left_double
              - wait_for_trigger:
                  - platform: device
                    device_id: !input remote
                    domain: zha
                    type: remote_button_short_press
                    subtype: turn_on
                  # - platform: device
                  #   device_id: !input remote
                  #   domain: zha
                  #   type: remote_button_double_press
                  #   subtype: turn_on
                  # - platform: device
                  #   device_id: !input remote
                  #   domain: zha
                  #   type: remote_button_triple_press
                  #   subtype: turn_on
                  # - platform: device
                  #   device_id: !input remote
                  #   domain: zha
                  #   type: remote_button_quadruple_press
                  #   subtype: turn_on
                  # - platform: device
                  #   device_id: !input remote
                  #   domain: zha
                  #   type: remote_button_quintuple_press
                  #   subtype: turn_on
                timeout:
                  hours: 0
                  minutes: 0
                  seconds: "{{ long_timeout_s }}"
                  milliseconds: 0
              - if:
                  - condition: template
                    value_template: "{{ not wait.trigger }}"
                then:
                else:
                  - sequence: !input button_left_triple
                  - wait_for_trigger:
                      - platform: device
                        device_id: !input remote
                        domain: zha
                        type: remote_button_short_press
                        subtype: turn_on
                      # - platform: device
                      #   device_id: !input remote
                      #   domain: zha
                      #   type: remote_button_double_press
                      #   subtype: turn_on
                      # - platform: device
                      #   device_id: !input remote
                      #   domain: zha
                      #   type: remote_button_triple_press
                      #   subtype: turn_on
                      # - platform: device
                      #   device_id: !input remote
                      #   domain: zha
                      #   type: remote_button_quadruple_press
                      #   subtype: turn_on
                      # - platform: device
                      #   device_id: !input remote
                      #   domain: zha
                      #   type: remote_button_quintuple_press
                      #   subtype: turn_on
                    timeout:
                      hours: 0
                      minutes: 0
                      seconds: "{{ long_timeout_s }}"
                      milliseconds: 0
                  - if:
                      - condition: template
                        value_template: "{{ not wait.trigger }}"
                    then:
                    else:
                      - sequence: !input button_left_quadruple
                      - wait_for_trigger:
                          - platform: device
                            device_id: !input remote
                            domain: zha
                            type: remote_button_short_press
                            subtype: turn_on
                          # - platform: device
                          #   device_id: !input remote
                          #   domain: zha
                          #   type: remote_button_double_press
                          #   subtype: turn_on
                          # - platform: device
                          #   device_id: !input remote
                          #   domain: zha
                          #   type: remote_button_triple_press
                          #   subtype: turn_on
                          # - platform: device
                          #   device_id: !input remote
                          #   domain: zha
                          #   type: remote_button_quadruple_press
                          #   subtype: turn_on
                          # - platform: device
                          #   device_id: !input remote
                          #   domain: zha
                          #   type: remote_button_quintuple_press
                          #   subtype: turn_on
                        timeout:
                          hours: 0
                          minutes: 0
                          seconds: "{{ long_timeout_s }}"
                          milliseconds: 0
                      - if:
                          - condition: template
                            value_template: "{{ not wait.trigger }}"
                        then:
                        else: !input button_left_quintuple

      # - conditions: "{{ command == 'left_double_press' }}"
      #   sequence: !input button_left_double

      # - conditions: "{{ command == 'left_triple_press' }}"
      #   sequence: !input button_left_triple

      # - conditions: "{{ command == 'left_quadruple_press' }}"
      #   sequence: !input button_left_quadruple

      # - conditions: "{{ command == 'left_quintuple_press' }}"
      #   sequence: !input button_left_quintuple

      - conditions:
          - condition: trigger
            id: left_hold_start
        sequence:
          - repeat:
              count: 2
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ left_lights_on }}"
                  data:
                    brightness: "{{ min(255, left_cur_brightness + 16 * repeat.index) }}"
                    # brightness_step: 16
                    transition: 0.4
                - delay: 0.1

      # - conditions:
      #     - condition: trigger
      #       id: left_hold_release
      #   sequence:
      #     - delay: 1

      # - conditions: "{{ command == 'left_long_release' }}"
      #   sequence: !input button_left_double

